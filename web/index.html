async function watchJob(id,origin,chat=false){try{for(;;){const job=await api('/api/job?id='+id);if(!['queued','running'].includes(job.state)){if(job.state!=='completed'){const text=job.error||job.results?.find(r=>r.error)?.error||'Analysis was interrupted.';fail(new Error(text));}if(chat){chatBusy=false;if(scopeKey(origin)===scopeKey()&&tab==='chat')await renderChat();}else{activeJob=null;if(scopeKey(origin)===scopeKey()){await renderSelection();if(job.state==='completed'){tab='summary';renderRight();await renderTab()}}await refreshState()}return}await new Promise(resolve=>setTimeout(resolve,1000))}}catch(e){fail(e)}finally{if(chat)chatBusy=false;else activeJob=null;renderRight()}}

function renderModel(){const body=$('model-body');body.replaceChildren();const grid=make('div',undefined,'model-grid'),pcol=make('div'),mcol=make('div'),tcol=make('div'),p=providerSelect(picker.provider);p.size=4;p.setAttribute('aria-label','AI provider');const m=make('select');m.size=6;m.setAttribute('aria-label','AI model');const cached=modelCatalog.get(picker.provider)||[];const known=new Map(cached.map(v=>[v.id,v]));if(picker.model&&!known.has(picker.model))known.set(picker.model,{id:picker.model});if(settings.chat.provider===picker.provider&&!known.has(settings.chat.model))known.set(settings.chat.model,{id:settings.chat.model});for(const item of [...known.values()].sort((a,b)=>a.id.localeCompare(b.id)))m.append(new Option(item.id,item.id));m.value=picker.model;p.onchange=()=>{picker={...picker,provider:p.value,model:'',thinking:'default',context_limit:0,input_limit:0,pricing_known:false};renderModel()};m.onchange=()=>{picker.model=m.value;const info=known.get(m.value);if(info?.context_limit){picker.context_limit=info.context_limit;picker.input_limit=info.input_limit||info.context_limit}picker.pricing_known=false;renderModel()};const t=make('select');t.size=5;t.setAttribute('aria-label','Thinking level');for(const value of ['default','none','low','medium','high','xhigh'])t.append(new Option(value==='default'?'Model default':value==='none'?'None':value==='xhigh'?'Extra high':value[0].toUpperCase()+value.slice(1),value));t.value=picker.thinking||'none';t.onchange=()=>picker.thinking=t.value;for(const [col,label,select]of [[pcol,'Provider',p],[mcol,'Model',m],[tcol,'Thinking',t]])col.append(make('label',label),select);grid.append(pcol,mcol,tcol);body.append(grid);const row=make('div',undefined,'row');row.style.marginTop='16px';const custom=make('input');custom.value=picker.model;custom.placeholder='Or enter a model ID';custom.setAttribute('aria-label','Custom model ID');custom.style.flex='1';custom.oninput=()=>{picker.model=custom.value;picker.pricing_known=false};
